<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Clean up Arabic text: remove tashkeel, normalise alef, ya and ta marbuta, count words and letters, and convert digits.">
    <title>Arabic Text Tools</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <header class="page-header">
            <h1>Arabic Text Tools</h1>
            <p class="subtitle">Paste Arabic text, pick a tool, copy the result.</p>
        </header>

        <section class="card" aria-labelledby="input-label-title">
            <h2 id="input-label-title" class="visually-hidden">Input</h2>
            <label for="input-text">Text</label>
            <textarea id="input-text" rows="7" lang="ar" dir="rtl" spellcheck="false" placeholder="اكتب أو الصق النص هنا"></textarea>
        </section>

        <section class="card" aria-labelledby="tools-title">
            <h2 id="tools-title">Tools</h2>
            <div class="tools">
                <button type="button" data-tool="tashkeel">Remove tashkeel</button>
                <button type="button" data-tool="normalize">Normalise letters</button>
            </div>
            <fieldset class="options">
                <legend>Normalise</legend>
                <label class="check"><input type="checkbox" id="opt-alef" checked> <span lang="ar">أ إ آ ٱ</span> → <span lang="ar">ا</span></label>
                <label class="check"><input type="checkbox" id="opt-ya" checked> <span lang="ar">ى</span> → <span lang="ar">ي</span></label>
                <label class="check"><input type="checkbox" id="opt-ta" checked> <span lang="ar">ة</span> → <span lang="ar">ه</span></label>
                <label class="check"><input type="checkbox" id="opt-tatweel" checked> Remove tatweel (<span lang="ar">ـ</span>)</label>
            </fieldset>
        </section>

        <section class="card" aria-labelledby="output-title">
            <h2 id="output-title">Result</h2>
            <label for="output-text" class="visually-hidden">Result text</label>
            <textarea id="output-text" rows="7" lang="ar" dir="rtl" readonly></textarea>
        </section>
    </main>

    <script src="logic.js"></script>
    <script src="app.js"></script>
</body>

</html>
