<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Convert between Egyptian pounds, Saudi riyals, UAE dirhams, US dollars and euros using free daily exchange rates.">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <header class="page-header">
            <h1>Currency Converter</h1>
            <p class="subtitle">EGP, SAR, AED, USD and EUR at today's rates.</p>
        </header>

        <form id="converter" class="card converter" novalidate>
            <div class="field amount-field">
                <label for="amount">Amount</label>
                <input type="text" id="amount" name="amount" inputmode="decimal" autocomplete="off" value="100" aria-describedby="amount-error">
                <p class="field-error" id="amount-error"></p>
            </div>
            <div class="pair">
                <div class="field">
                    <label for="from">From</label>
                    <select id="from" name="from"></select>
                </div>
                <button type="button" class="swap" id="swap" aria-label="Swap currencies" title="Swap currencies">&#8646;</button>
                <div class="field">
                    <label for="to">To</label>
                    <select id="to" name="to"></select>
                </div>
            </div>
        </form>

        <p class="status" id="status" role="status" aria-live="polite" hidden></p>

        <section class="card result" aria-labelledby="result-title">
            <h2 id="result-title" class="visually-hidden">Result</h2>
            <p class="converted" id="converted" aria-live="polite"></p>
            <p class="rate" id="rate"></p>
            <div class="meta">
                <p id="updated"></p>
                <button type="button" class="link-btn" id="refresh">Refresh rates</button>
            </div>
        </section>

        <section class="card" aria-labelledby="others-title">
            <h2 id="others-title" class="small-title">Same amount in</h2>
            <ul class="others" id="others"></ul>
        </section>
    </main>

    <script src="logic.js"></script>
    <script src="app.js"></script>
</body>

</html>
