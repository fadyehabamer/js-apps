<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A small notes app that stores Markdown notes in your browser and shows a live preview.">
    <title>Markdown Notes</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">
        <header class="topbar">
            <h1>Markdown Notes</h1>
            <p class="save-state" id="save-state" role="status" aria-live="polite"></p>
            <button type="button" id="new-note" class="primary">New note</button>
        </header>

        <nav class="sidebar" aria-label="Notes">
            <div class="search">
                <label for="search" class="visually-hidden">Search notes</label>
                <input type="search" id="search" placeholder="Search notes" autocomplete="off">
            </div>
            <ul class="note-list" id="note-list"></ul>
            <p class="empty" id="list-empty" hidden>No notes yet.</p>
            <p class="empty" id="no-matches" hidden>No notes match your search.</p>
        </nav>

        <div class="no-selection" id="no-selection" hidden>
            <p>Pick a note on the left or create a new one.</p>
        </div>

        <main class="workspace" id="workspace">
            <section class="editor-pane" aria-labelledby="editor-title">
                <div class="pane-head">
                    <h2 id="editor-title" class="pane-title">Write</h2>
                    <button type="button" id="delete-note" class="danger">Delete</button>
                </div>
                <label for="editor" class="visually-hidden">Note text (Markdown)</label>
                <textarea id="editor" spellcheck="true" placeholder="# Title&#10;&#10;Write something..."></textarea>
            </section>

            <section class="preview-pane" aria-labelledby="preview-title">
                <h2 id="preview-title" class="pane-title">Preview</h2>
                <article class="preview" id="preview"></article>
            </section>
        </main>
    </div>

    <script src="logic.js"></script>
    <script src="app.js"></script>
</body>

</html>
