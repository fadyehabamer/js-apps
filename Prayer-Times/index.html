<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Daily prayer times for any city from the Aladhan API, with a countdown to the next prayer in Arabic or English.">
    <title>Prayer Times</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <header class="page-header">
            <div class="lang-switch" role="group" aria-labelledby="lang-label">
                <span id="lang-label" class="visually-hidden" data-i18n="language">Language</span>
                <button type="button" class="lang-btn" data-lang="en" lang="en" aria-pressed="true">English</button>
                <button type="button" class="lang-btn" data-lang="ar" lang="ar" aria-pressed="false">العربية</button>
            </div>
            <h1 data-i18n="title">Prayer Times</h1>
            <p class="subtitle" data-i18n="subtitle">Today's prayer times for a city, from the Aladhan API.</p>
        </header>

        <form id="city-form" class="card search" novalidate>
            <div class="field">
                <label for="city" data-i18n="city">City</label>
                <input type="text" id="city" name="city" autocomplete="address-level2" placeholder="Cairo" required>
            </div>
            <div class="field">
                <label for="country" data-i18n="country">Country</label>
                <input type="text" id="country" name="country" autocomplete="country-name" placeholder="Egypt" required>
            </div>
            <div class="field">
                <label for="method" data-i18n="method">Calculation method</label>
                <select id="method" name="method">
                    <option value="5" data-i18n="method5">Egyptian General Authority of Survey</option>
                    <option value="4" data-i18n="method4">Umm al-Qura, Makkah</option>
                    <option value="8" data-i18n="method8">Gulf Region</option>
                    <option value="3" data-i18n="method3">Muslim World League</option>
                    <option value="2" data-i18n="method2">ISNA (North America)</option>
                    <option value="1" data-i18n="method1">University of Islamic Sciences, Karachi</option>
                </select>
            </div>
            <button type="submit" id="submit-btn" data-i18n="submit">Get times</button>
        </form>

        <p class="status" id="status" role="status" aria-live="polite"></p>

        <section class="card results" id="results" aria-labelledby="results-title" hidden>
            <h2 id="results-title" data-i18n="results">Times</h2>
            <p class="meta" id="date-line"></p>
            <p class="cache-note" id="cache-note" hidden></p>
            <div class="next" id="next-box" hidden>
                <span id="next-label"></span>
                <strong class="countdown" id="countdown" role="timer"></strong>
            </div>
            <ul class="times" id="times-list"></ul>
        </section>
    </main>

    <script src="logic.js"></script>
    <script src="app.js"></script>
</body>

</html>
